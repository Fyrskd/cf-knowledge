server {
    listen 80;
    listen [::]:80;
    server_name haduk1.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://haduk1.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name haduk1.top;

    ssl_certificate /etc/letsencrypt/live/haduk1.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haduk1.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /extracker {
        return 301 /extracker/;
    }

    location /extracker/ {
        alias /var/www/cf-knowledge/current/;
        index index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        return 404;
    }

    gzip on;
    gzip_types application/javascript application/json text/css;
}
